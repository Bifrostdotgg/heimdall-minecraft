name: Build

# `./gradlew build` is the whole gate: it compiles every module at its own
# release level, runs the unit tests, runs the ArchUnit conformance rules, and
# then verifies the shaded jar itself (bytecode levels, relocations, plugin.yml
# and velocity-plugin.json). There is deliberately nothing else to add here.
#
# Actions are pinned to commit SHAs rather than tags. A tag is mutable, so `@v4`
# means "whatever the action's owner points it at today" — including after a
# repository compromise. Each pin is the commit `v4` resolved to when it was
# taken; the trailing comment records the release, and bumping one is a visible
# diff instead of a silent change.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload snapshot JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heimdall-whitelist-snapshot
          path: app/build/libs/heimdall-whitelist-*.jar
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
