name: Build

# Two gates.
#
# `./gradlew build` compiles every module at its own release level, runs the unit
# tests (including :stub-bot's), runs the ArchUnit conformance rules, and then
# verifies the shaded jar itself (bytecode levels, relocations, plugin.yml and
# velocity-plugin.json). That covers everything visible by reading the jar.
#
# The `smoke` matrix covers what is not: whether a real server of each supported
# generation actually loads and unloads the thing. A plugin can pass every static
# check and still be refused at runtime — a descriptor the loader parses
# differently, a class that resolves on Java 21 and not on Java 8. One row per
# runner, in parallel, so the wall time is the slowest row rather than their sum.
#
# Actions are pinned to commit SHAs rather than tags. A tag is mutable, so `@v4`
# means "whatever the action's owner points it at today" — including after a
# repository compromise. Each pin is the commit `v4` resolved to when it was
# taken; the trailing comment records the release, and bumping one is a visible
# diff instead of a silent change.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload snapshot JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heimdall-whitelist-snapshot
          path: app/build/libs/heimdall-whitelist-*.jar
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # The row list is read out of smoke/run.sh rather than written here. Two copies
  # of a matrix drift, and the failure mode is silent: a row added to the script
  # but not to the workflow simply never runs, and nobody finds out.
  smoke-matrix:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every smoke assertion is a grep, and a grep that matches nothing looks exactly
      # like a clean server log. This points the patterns at lines that must trip them
      # and at real log noise that must not. It needs no Docker, so it runs here and
      # fails the whole matrix before six runners spend twenty minutes proving nothing.
      - name: Verify the smoke assertions themselves
        run: smoke/run.sh --selftest

      - id: rows
        run: |
          rows="$(smoke/run.sh --list | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "rows=${rows}" >> "$GITHUB_OUTPUT"
          echo "smoke rows: ${rows}"

  smoke:
    name: smoke (${{ matrix.row }})
    needs: [build, smoke-matrix]
    runs-on: ubuntu-latest
    # A row failing tells you which server generation broke; the other rows tell
    # you whether it is that generation or the jar. Stopping at the first failure
    # would throw that away.
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJson(needs.smoke-matrix.outputs.rows) }}
    # Each row is bounded internally (SMOKE_BOOT_TIMEOUT), so this is a backstop
    # against a hung pull or a wedged daemon, not the primary limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the jar built by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: heimdall-whitelist-snapshot
          # smoke/run.sh looks in app/build/libs and dist/, so no wiring needed.
          path: dist

      - name: Boot smoke
        run: smoke/run.sh "${{ matrix.row }}"

      - name: Upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-log-${{ matrix.row }}
          path: smoke/.work/**/server.log
          if-no-files-found: warn
