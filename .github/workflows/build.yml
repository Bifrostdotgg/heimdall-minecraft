name: Build

# Two gates.
#
# `./gradlew build` compiles every module at its own release level, runs the unit
# tests (including :stub-bot's), runs the ArchUnit conformance rules, and then
# verifies the shaded jar itself (bytecode levels, relocations, plugin.yml and
# velocity-plugin.json). That covers everything visible by reading the jar.
#
# The `smoke` matrix covers what is not: whether a real server of each supported
# generation actually loads and unloads the thing. A plugin can pass every static
# check and still be refused at runtime — a descriptor the loader parses
# differently, a class that resolves on Java 21 and not on Java 8. One row per
# runner, in parallel, so the wall time is the slowest row rather than their sum.
#
# The `connected` job covers the third thing neither of those can: whether the
# plugin, pointed at a real bot, actually talks to it. It found a bootstrap
# deadlock on its first run that no unit test could see, because it was the first
# boot with real modules and a real bot in one process.
#
# Actions are pinned to commit SHAs rather than tags. A tag is mutable, so `@v4`
# means "whatever the action's owner points it at today" — including after a
# repository compromise. Each pin is the commit `v4` resolved to when it was
# taken; the trailing comment records the release, and bumping one is a visible
# diff instead of a silent change.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload snapshot JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heimdall-whitelist-snapshot
          path: app/build/libs/heimdall-whitelist-*.jar
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # The row list is read out of smoke/run.sh rather than written here. Two copies
  # of a matrix drift, and the failure mode is silent: a row added to the script
  # but not to the workflow simply never runs, and nobody finds out.
  smoke-matrix:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every smoke assertion is a grep, and a grep that matches nothing looks exactly
      # like a clean server log. This points the patterns at lines that must trip them
      # and at real log noise that must not. It needs no Docker, so it runs here and
      # fails the whole matrix before six runners spend twenty minutes proving nothing.
      - name: Verify the smoke assertions themselves
        run: smoke/run.sh --selftest

      # The connected scenario's assertions are separate constants in a separate file, so run.sh's
      # self-test says nothing about them. Both run here, Docker-free, and fail the whole matrix
      # before any runner spends twenty minutes proving nothing.
      - name: Verify the connected assertions themselves
        run: smoke/connected.sh --selftest

      - id: rows
        run: |
          rows="$(smoke/run.sh --list | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "rows=${rows}" >> "$GITHUB_OUTPUT"
          echo "smoke rows: ${rows}"

  smoke:
    name: smoke (${{ matrix.row }})
    needs: [build, smoke-matrix]
    runs-on: ubuntu-latest
    # A row failing tells you which server generation broke; the other rows tell
    # you whether it is that generation or the jar. Stopping at the first failure
    # would throw that away.
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJson(needs.smoke-matrix.outputs.rows) }}
    # Each row is bounded internally (SMOKE_BOOT_TIMEOUT), so this is a backstop
    # against a hung pull or a wedged daemon, not the primary limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the jar built by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: heimdall-whitelist-snapshot
          # smoke/run.sh looks in app/build/libs and dist/, so no wiring needed.
          path: dist

      - name: Boot smoke
        run: smoke/run.sh "${{ matrix.row }}"

      - name: Upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-log-${{ matrix.row }}
          path: smoke/.work/**/server.log
          if-no-files-found: warn

  # The other half of the smoke question: pointed at a real bot, does the plugin
  # actually talk to it? run.sh proves the jar loads with nothing to talk to;
  # this proves guild discovery, the v3 handshake, a config push, a signed
  # whitelist sync and console streaming, asserting from BOTH ends — half of it
  # reads the stub's log rather than the plugin's.
  #
  # It is not optional and it is not a nightly. This scenario found the
  # capability deadlock (departure D55) on its first ever run, and it found it
  # because it was the first boot in the project's history with real modules and
  # a real bot in one process. 700-odd unit tests could not see it: the module
  # tests have no tunnel and the tunnel tests have no modules. A scenario like
  # that going stale is how the same class of bug comes back.
  #
  # Two rows rather than six, in parallel: the wire does not vary by Minecraft
  # version, and what does — class loading, the log4j tap — the matrix above
  # already covers everywhere.
  connected:
    name: connected (${{ matrix.row }})
    needs: [build, smoke-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        row: [paper-1.21.8, velocity-3.5.1]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The stub-bot launcher, which is not in the build job's artifact — that
      # uploads the shaded plugin jar and nothing else. installDist alone rather
      # than a full build: the jar comes from the artifact below, and rebuilding
      # it here would be several minutes to produce a file we already have.
      - name: Build the stub bot
        run: ./gradlew :stub-bot:installDist --stacktrace

      - name: Download the jar built by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: heimdall-whitelist-snapshot
          # connected.sh looks in app/build/libs and dist/, like run.sh.
          path: dist

      - name: Connected smoke
        run: smoke/connected.sh "${{ matrix.row }}"

      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connected-log-${{ matrix.row }}
          # Both sides. The stub's log is half the evidence — several assertions
          # are about what IT saw — so a failure report without it is unreadable.
          path: |
            smoke/.work-connected/**/server.log
            smoke/.work-connected/**/stub.log
          if-no-files-found: warn
