#Daemon JVM criteria for the Heimdall build.
#Gradle 8.14 does not run on JDK 25+, and the failure without this file is a bare
#"Unsupported class file major version" / version string with no hint about what
#to install. Pinning the criteria makes Gradle select a detected JDK 21 whatever
#the contributor's JAVA_HOME happens to be, and fail with an actionable message
#if there is not one.
toolchainVersion=21
