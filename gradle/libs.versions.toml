# Single source of truth for every dependency coordinate in the build.
# Module build files reference `libs.<alias>` only — no inline coordinates.

[versions]
# Shaded into the plugin jar and relocated under com.heimdall.libs.
gson = "2.10.1"
snakeyaml = "2.4"
# Must stay zero-dependency and free of any logging facade: legacy Spigot ships
# no slf4j. See the comment in core/build.gradle.kts.
nv-websocket-client = "2.14"
adventure-platform = "4.3.4"
# Pinned to exactly what adventure-platform-bukkit 4.3.4 resolves adventure-api to.
# core needs the platform-free half of Adventure on its OWN classpath (the Msg
# renderer and the pipeline deny-reasons speak Component), and letting the two
# arrive at different versions would mean the shaded jar carries whichever
# Gradle's conflict resolution picked rather than the one platform-bukkit was
# compiled against. 4.13.x is also still Java 8 bytecode, which
# :app:verifyShadowJar's major-52 ceiling proves on every build.
adventure = "4.13.1"

# Server platform APIs. compileOnly everywhere — none of this reaches the jar,
# which is what makes the remaining -SNAPSHOTs tolerable: a re-resolved snapshot
# can break compilation on a cold CI runner, but it can never change what ships.
#
# spigot-api and paper-api publish -SNAPSHOT only; there is no release to pin.
spigot-api = "1.8.8-R0.1-SNAPSHOT"
paper-api = "1.16.5-R0.1-SNAPSHOT"
# velocity-api does publish releases, so 3.4.0 is pinned rather than
# 3.4.0-SNAPSHOT. (It still pulls velocity-brigadier:1.0.0-SNAPSHOT
# transitively, which upstream has never released — also compileOnly.)
velocity-api = "3.4.0"

# Optional integrations. compileOnly everywhere, like the platform APIs: LuckPerms is a plugin the
# server may or may not have, and log4j-core is the server's OWN logging backend (bundled with
# Minecraft since 1.7 and used directly by Velocity), so neither is ever shaded in.
#
# net.luckperms:api is platform-neutral — the same artifact on Bukkit and on Velocity — which is
# what lets the group-diff logic be written once in :platform-common rather than twice.
#
# The log4j version here is a COMPILE target, not what will be present. Minecraft 1.8.8 ships
# 2.0-beta9, so :platform-common is restricted to the API surface that exists in both; see
# Log4jConsoleTap.
luckperms-api = "5.4"
log4j = "2.19.0"

# Test and verification tooling.
junit = "5.10.2"
mockito = "4.11.0"
archunit = "1.3.0"

# :stub-bot only — the CI-side fixture that speaks the bot's wire contract.
#
# Java-WebSocket is the library `core` deliberately rejected (see the long
# comment in core/build.gradle.kts: it calls org.slf4j.LoggerFactory from three
# constructors, and legacy Spigot ships no slf4j). That constraint is about the
# SHIPPED jar. The stub is a server, runs only on CI and dev machines on the
# JDK 21 toolchain, and is never shaded in — :app does not depend on it, and
# :app:verifyShadowJar's allowlist would fail the build if it somehow were. So
# here slf4j is just another jar on the classpath, and the mature server-side
# implementation is worth more than the zero-dependency constraint.
java-websocket = "1.6.0"
slf4j = "2.0.17"

# Applied in the root build script.
shadow = "8.3.6"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
nv-websocket-client = { module = "com.neovisionaries:nv-websocket-client", version.ref = "nv-websocket-client" }
adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version.ref = "adventure-platform" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }

spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }
paper-api = { module = "com.destroystokyo.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }

luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms-api" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "java-websocket" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
