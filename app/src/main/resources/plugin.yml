name: Heimdall
main: com.heimdall.platform.bukkit.HeimdallBukkitPlugin
version: @version@
author: Bifrost
website: https://bifrost.gg
description: Discord-to-Minecraft whitelist, role sync, punishments and console relay

# No `api-version` on purpose: declaring one makes the server refuse to load the
# plugin on 1.8.8, which is a supported target. Modern Paper logs a "legacy
# plugin" warning as a result — accepted, and cheaper than dropping the floor.

# Every command a module can claim has to be declared here.
#
# Bukkit fixes a command's existence and its aliases at load time. The command map
# can be reached reflectively; v2 did not do it and neither does this — the map's
# shape has changed across the decade of servers this jar supports, the reflective
# path is invisible to the conformance rules, and the failure is a verb that
# silently does not exist on one server generation. So the names live here, and
# BukkitCommandRegistrar binds a module's handler to whichever of them it asks for.
#
# A name declared here that no enabled module has claimed answers with its usage
# line, which is the right behaviour for a feature that is switched off.
#
# `permission:` is declared on every command, and it is not decoration. Without it
# Bukkit gives a command NAME-level visibility to everyone: an unprivileged player
# typing `/h<tab>` sees hd, heimdall, hwl and offend in their completion, which is
# both noise and a hint at commands they cannot run. Declaring the node here makes
# Bukkit hide the name from a player who lacks it — the registrar's own gate stops
# the command running, but only the descriptor can stop it being *seen*.
commands:
  hd:
    description: Heimdall administration
    usage: /<command>
    aliases: [heimdall]
    permission: heimdall.admin
  hwl:
    # v2's admin verb. Kept as a real command rather than as an alias of `hd`,
    # because Bukkit fixes aliases at load time and the plugin has to be able to
    # tell the two apart: this one prints "the name changed" once per start
    # before forwarding. Deliberately absent from /hd's own help listing — help
    # is for what to type next, not for what used to work.
    #
    # `heimdallwhitelist` was v2's spelled-out alias for it and is restored here,
    # so a runbook or a macro that spells it out keeps working across the upgrade.
    description: Deprecated alias for /hd
    usage: /<command>
    aliases: [heimdallwhitelist]
    permission: heimdall.admin
  linkdiscord:
    description: Get a code to link this Minecraft account to Discord
    usage: /<command>
    # /link is the alias players actually type. Declared here because Bukkit will
    # not accept one at runtime; the proxy registers the same pair dynamically.
    aliases: [link]
    permission: heimdall.linkdiscord
  offend:
    description: Record an offence against a player and apply the escalation tier
    usage: /<command> <player> <offense> [notes]
    permission: heimdall.offend

permissions:
  heimdall.admin:
    description: Use Heimdall's administrative commands
    # Operators only. Every subcommand this gates is a server-wide change, and a
    # server that wants finer control has a permissions plugin for exactly that.
    default: op
  heimdall.linkdiscord:
    description: Request a Discord link code for your own account
    # Everyone, on purpose: linking is how a player gets themselves whitelisted,
    # so gating it to operators would lock out the people it exists for. The
    # command only ever acts on the sender's own account.
    default: true
  heimdall.offend:
    description: Record offences against players
    default: op
  heimdall.bypass:
    # Note that this does NOT bypass the whitelist itself. Permissions are not
    # attached during AsyncPlayerPreLoginEvent — the player object does not exist
    # yet — which is why the login bypass is a UUID list in the dashboard instead
    # (issue #796 / MC-2). What this node bypasses is the /linkdiscord cooldown,
    # which is checked when the player is very much online.
    description: Skip Heimdall's per-player command cooldowns
    default: op
