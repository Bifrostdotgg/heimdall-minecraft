group=com.heimdall
version=3.0.0-SNAPSHOT

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g

# On by default so configuration-cache-hostile patterns (Task.project at
# execution time, Configuration objects captured into task actions, lambdas in
# .kts capturing the script object) fail immediately for whoever wrote them,
# rather than accumulating until someone tries to turn this on later.
org.gradle.configuration-cache=true

# Let Gradle fetch the JDK 21 toolchain when the machine does not already have one.
org.gradle.java.installations.auto-download=true
